<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><title>QA 待办示例</title>
<style>body{font:18px system-ui;max-width:650px;margin:60px auto}input,button{font:inherit;padding:8px}li{margin:12px 0}</style>
<h1>待办事项</h1>
<form><label for="title">任务名称</label> <input id="title" maxlength="100" required><button>添加</button></form>
<p role="alert" hidden></p><ul aria-label="任务列表"></ul>
<script type="module">
const tenant = new URLSearchParams(location.search).get('tenant') || crypto.randomUUID();
const list = document.querySelector('ul');
const alert = document.querySelector('[role=alert]');
async function api(path = '', options = {}) {
  const response = await fetch('/api/todos' + path, {
    ...options, headers: { 'content-type': 'application/json', 'x-test-tenant': tenant },
  });
  if (!response.ok) throw new Error('请求失败：' + response.status);
  return response.json();
}
async function render() {
  const todos = await api();
  list.replaceChildren();
  for (const todo of todos) {
    const li = document.createElement('li');
    li.dataset.testid = 'todo-item';
    const label = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox'; checkbox.checked = todo.completed;
    checkbox.addEventListener('change', async () => {
      try { await api('/' + todo.id, { method: 'PATCH', body: JSON.stringify({ completed: checkbox.checked }) }); }
      catch (error) { checkbox.checked = !checkbox.checked; showError(error); }
    });
    label.append(checkbox, document.createTextNode(todo.title)); li.append(label); list.append(li);
  }
}
function showError(error) { alert.textContent = error.message; alert.hidden = false; }
document.querySelector('form').addEventListener('submit', async event => {
  event.preventDefault();
  const input = document.querySelector('#title');
  try {
    await api('', { method: 'POST', body: JSON.stringify({ title: input.value }) });
    input.value = ''; alert.hidden = true; await render();
  } catch (error) { showError(error); }
});
await render();
</script>
</html>

name: QA Automation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-api-agent-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-api-agent-tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-api-results
          path: |
            web-api-agent-tests/playwright-report/
            web-api-agent-tests/test-results/
          retention-days: 7
  mobile-framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: mobile-agent-tests/requirements-lock.txt
      - run: python -m pip install -r mobile-agent-tests/requirements-lock.txt
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python -m pytest tests/unit --html=artifacts/unit-report.html --self-contained-html --junitxml=artifacts/unit-junit.xml
        working-directory: mobile-agent-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-framework-results
          path: mobile-agent-tests/artifacts/
          retention-days: 7
